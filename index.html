<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legends League &mdash; Oakville Padel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0A1712; --card:#0F211A; --card2:#142B22; --line:#1d3a2f; --line2:#2b5042;
    --text:#F1F4EA; --mute:#9FB3A8; --dim:#6B8478; --green:#5FBF8F; --gold:#E6F07A; --red:#E0603F;
    --ca:#E6F07A; --cb:#6FA8FF; --cc:#E8895A;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;-webkit-text-size-adjust:100%}
  a{color:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:0 18px}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(11,29,46,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
  .brand{font-family:'Bebas Neue',sans-serif;font-weight:700;font-size:21px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .brand span{color:var(--gold)}
  .brand small{display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:400;letter-spacing:1px;color:var(--dim);margin-top:1px}
  .nav{display:flex;gap:4px}
  .nav a{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);text-decoration:none;padding:8px 11px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
  .nav a:hover{color:var(--text)}
  .nav a.on{background:var(--green);color:#0A1712;font-weight:600}

  main{padding:22px 0 70px;min-height:70vh}
  h2.sec{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--green);text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
  h2.sec .hint{font-size:9.5px;color:var(--dim);letter-spacing:0;text-transform:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .mono{font-family:'IBM Plex Mono',monospace}
  .muted{color:var(--dim)}

  /* hero */
  .hero{border:1px solid var(--gold);background:linear-gradient(135deg,#0F211A,#142B22);border-radius:10px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .hero-k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
  .hero-t{font-family:'Bebas Neue',sans-serif;font-weight:700;font-size:30px;text-transform:uppercase;line-height:1.1;margin-top:4px}
  .hero-s{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);margin-top:6px}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:5px 10px;border-radius:14px;border:1px solid var(--dim);color:var(--mute);white-space:nowrap}
  .chip.go{border-color:var(--green);background:rgba(95,191,143,.18);color:#7fd9ad}
  .chip.wait{border-color:var(--gold);background:rgba(230,240,122,.14);color:var(--gold)}

  /* attendees */
  .att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .att{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer}
  .att:hover{border-color:var(--gold)}
  .att .rk{font-family:'Bebas Neue',sans-serif;font-weight:700;font-size:16px;color:var(--gold);min-width:30px}
  .att .nm{font-weight:600;font-size:13.5px;flex:1}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

  /* courts */
  .courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .court{background:var(--card2);border-radius:8px;border-top:4px solid var(--dim);padding:12px 14px 8px}
  .court-t{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
  .row:first-of-type{border-top:0}
  .row:hover .pn{color:var(--gold)}
  .pn{font-weight:600}
  .rkx{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
  .mv{font-family:'IBM Plex Mono',monospace;font-size:10.5px}
  .up{color:#7fd9ad}.down{color:#f08a73}.flat{color:var(--dim)}
  .medal{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
  .m1{background:rgba(230,240,122,.22);color:var(--gold);border:1px solid var(--gold)}
  .m2{background:rgba(200,208,218,.16);color:#C8D0DA;border:1px solid #C8D0DA}
  .m3{background:rgba(205,127,50,.2);color:#CD8032;border:1px solid #CD8032}
  .m4{background:rgba(92,114,133,.15);color:var(--dim);border:1px solid var(--dim)}
  .void{color:var(--red)}
  .pending{text-align:center;padding:30px 12px;color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px dashed var(--line2);border-radius:8px}

  /* badges */
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;text-align:center}
  .b-active{background:rgba(95,191,143,.18);color:#7fd9ad;border:1px solid var(--green)}
  .b-grace{background:rgba(230,240,122,.15);color:var(--gold);border:1px solid var(--gold)}
  .b-atrisk{background:rgba(230,240,122,.28);color:var(--gold);border:1px solid var(--gold)}
  .b-penalty{background:rgba(224,96,63,.18);color:#f08a73;border:1px solid var(--red)}
  .b-locked{background:rgba(92,114,133,.2);color:var(--mute);border:1px solid var(--dim)}
  .b-new{background:rgba(237,234,226,.12);color:var(--text);border:1px solid var(--dim)}

  /* standings */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .search{flex:1;min-width:170px;background:var(--card);border:1px solid var(--line2);color:var(--text);padding:9px 12px;border-radius:6px;font-family:'Manrope',sans-serif;font-size:13px}
  .search:focus{outline:none;border-color:var(--green)}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:6px 10px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer;text-transform:uppercase}
  .pill.on{background:var(--green);border-color:var(--green);color:#0A1712;font-weight:600}
  .rung{display:grid;grid-template-columns:40px 1fr 66px 120px auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;border-radius:6px;padding:9px 14px;margin-bottom:6px;cursor:pointer}
  .rung:hover{background:var(--card2);border-left-color:var(--gold)}
  .rung .r{font-family:'Bebas Neue',sans-serif;font-size:20px;font-weight:700}
  .rung .n{font-weight:600;font-size:14px}
  .form{display:flex;gap:4px;justify-content:flex-end}
  .fm{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;min-width:24px;text-align:center;padding:3px 4px;border-radius:3px}
  .top5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .t5{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
  .t5:hover{border-color:var(--gold);background:var(--card2)}
  .t5 .r{font-family:'Bebas Neue',sans-serif;font-size:26px;font-weight:700;color:var(--gold);line-height:1}
  .t5 .n{font-weight:600;font-size:13px;margin:4px 0 6px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);font-weight:600;line-height:1.1}
  .stat span{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);text-transform:uppercase;margin-top:5px;letter-spacing:.4px}
  .stat i{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:2px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:120px;overflow-x:auto;padding-bottom:2px}
  .bcol{flex:1;min-width:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
  .bar{width:100%;max-width:26px;background:linear-gradient(180deg,#5FBF8F,#5FBF8F);border-radius:3px 3px 0 0}
  .bn{font-family:'Bebas Neue',sans-serif;font-size:11px}
  .bw{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--dim)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
  .li{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute)}
  .champ{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
  .cseg{flex:0 0 38px;text-align:center}
  .cbox{height:34px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9.5px}
  .cwk{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--mute);margin-top:3px}

  /* weeks */
  .wbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .wnav{flex:0 0 auto;width:38px;height:38px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:16px;cursor:pointer}
  .wnav:disabled{opacity:.3;cursor:default}
  .wsel{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--text);padding:10px 12px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px}
  .strip{display:flex;gap:5px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .wc{flex:0 0 auto;min-width:52px;text-align:center;padding:7px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-family:'IBM Plex Mono',monospace}
  .wc b{display:block;font-size:11px;color:var(--text)}
  .wc i{display:block;font-style:normal;font-size:8.5px;color:var(--dim);margin-top:2px}
  .wc.on{background:var(--green);border-color:var(--green)}
  .wc.on b,.wc.on i{color:#0A1712}
  .wc.up2{border-color:var(--gold)}
  .wc.off{opacity:.55;border-style:dashed;cursor:default}
  .wh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
  .wh h3{margin:0;font-family:'Bebas Neue',sans-serif;font-size:26px;text-transform:uppercase}
  .rk-row{display:grid;grid-template-columns:34px 1fr 60px;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
  details.card summary{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
  .note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:8px}


  /* trends */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 12px 8px}
  .chartbox svg{display:block;width:100%;height:auto}
  .tabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap;align-items:center}
  .tabs .lab{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;margin-right:4px}
  .hm-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  table.hm{border-collapse:separate;border-spacing:2px;font-family:'IBM Plex Mono',monospace;font-size:9px}
  table.hm th{position:sticky;top:0;background:var(--card);color:var(--dim);font-weight:400;padding:4px 0;z-index:2;min-width:17px}
  table.hm td.nm{position:sticky;left:0;background:var(--card);z-index:1;padding:2px 8px 2px 8px;white-space:nowrap;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;min-width:118px}
  table.hm th.nm{left:0;z-index:3}
  table.hm td.c{width:17px;height:17px;border-radius:3px;background:#0d2236;cursor:pointer}
  table.hm td.c.p{background:var(--green)}
  table.hm td.c.v{background:var(--red)}
  table.hm td.c.x{background:transparent;border:1px dashed #1a3249}
  table.hm td.s{padding:0 6px;color:var(--mute);text-align:right;white-space:nowrap}
  .reigns{display:flex;gap:3px;min-width:720px}
  .reign{border-radius:6px;padding:10px 6px;text-align:center;cursor:pointer;border:2px solid transparent;min-width:26px;overflow:hidden}
  .reign.on{border-color:#fff}
  .reign b{display:block;font-size:12px;white-space:nowrap}
  .reign i{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:9px;margin-top:3px;opacity:.85}
  .axis{display:flex;gap:3px;min-width:720px;margin-top:4px}
  .axis div{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--dim);text-align:center;overflow:hidden;white-space:nowrap}
  .throne{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;border:1px solid var(--gold);background:linear-gradient(135deg,#0F211A,#1b3a57);border-radius:10px;padding:18px 20px;margin-bottom:12px}
  .throne .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
  .throne .t{font-family:'Bebas Neue',sans-serif;font-size:32px;font-weight:700;text-transform:uppercase;line-height:1.1;margin-top:3px}
  .throne .s{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);margin-top:4px}
  .lb{display:grid;grid-template-columns:24px 90px 1fr 70px 70px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .lb:first-child{border-top:0}
  .lb .bar2{height:14px;border-radius:3px}
  .lbh{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);text-transform:uppercase}
  .tog{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 10px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:6px}
  .tog.on{background:var(--card2);color:var(--text);border-color:var(--mute)}
  @media(max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}.throne{grid-template-columns:1fr}.throne .t{font-size:25px}.lb{grid-template-columns:20px 74px 1fr 52px 52px;gap:6px;font-size:12px}}


  /* attendance + provisional courts */
  .btn{font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--green);color:#0A1712}
  .btn.alt{background:transparent;border:1px solid var(--line2);color:var(--text)}
  .btn.warn{background:var(--red);color:#fff}
  .btn.gold{background:var(--gold);color:#0A1712}
  .btn:disabled{opacity:.45;cursor:default}
  .me{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .me .who{font-size:15px;font-weight:600}
  .me .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:3px}
  .lblrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .lblrow .pill2{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:5px 11px;border-radius:14px;font-weight:600}
  .pill2.prov{background:rgba(230,240,122,.16);color:var(--gold);border:1px solid var(--gold)}
  .pill2.conf{background:rgba(95,191,143,.2);color:#7fd9ad;border:1px solid var(--green)}
  .banner{border:1px solid var(--gold);background:rgba(230,240,122,.1);color:#f4d27a;border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:10px;line-height:1.5}
  .banner.bad{border-color:var(--red);background:rgba(224,96,63,.12);color:#f2a1a1}
  .notes{margin-top:10px}
  .notes div{font-size:12px;line-height:1.5;color:var(--mute);padding:3px 0 3px 14px;position:relative}
  .notes div:before{content:"\2022";position:absolute;left:2px;color:var(--gold)}
  .mbox{background:var(--card);border:1px solid var(--green);border-radius:14px;width:min(440px,100%);max-height:88vh;overflow:auto;padding:22px}
  .mbox h3{margin:0 0 6px;font-family:'Bebas Neue',sans-serif;text-transform:uppercase;font-size:20px}
  .mbox p{font-size:13.5px;line-height:1.55;color:#d4d9de;margin:6px 0 14px}
  .mbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .plist{max-height:46vh;overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
  .pitem{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600}
  .pitem:first-child{border-top:0}
  .pitem:hover{background:var(--card2)}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;padding:2px 7px;border-radius:3px}
  .tag.in{background:rgba(95,191,143,.2);color:#7fd9ad;border:1px solid var(--green)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#142B22;border:1px solid var(--green);color:var(--text);padding:12px 18px;border-radius:8px;z-index:90;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:92vw}
  .toast.err{border-color:var(--red)}
  .field{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);padding:10px 12px;border-radius:6px;font-family:'Manrope',sans-serif;font-size:14px}
  .arow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .act{font-size:12px;padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .act span:last-child{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}

  /* rules */
  .rule h3{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;font-size:17px;margin:0 0 8px}
  .rule p,.rule li{font-size:13.5px;line-height:1.6;color:#d4d9de}
  .rule ul{margin:6px 0 0;padding-left:18px}
  .rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  table.st{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.st td,table.st th{padding:6px 8px;border-top:1px solid var(--line);text-align:left}
  table.st th{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;font-weight:400}

  /* player panel */
  .ov{position:fixed;inset:0;background:rgba(4,12,20,.82);z-index:60;display:flex;justify-content:center;align-items:flex-end;padding:0}
  .panel{background:var(--card);border:1px solid var(--green);border-radius:14px 14px 0 0;width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:22px 22px 26px}
  @media(min-width:700px){.ov{align-items:center;padding:20px}.panel{border-radius:12px}}
  .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ph .r{font-family:'Bebas Neue',sans-serif;font-size:46px;font-weight:700;color:var(--gold);line-height:1}
  .ph .n{font-weight:700;font-size:20px;margin:4px 0 6px}
  .x{background:transparent;border:1px solid var(--dim);color:var(--text);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:15px}
  .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 6px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid3 .c{background:var(--card2);border-radius:6px;padding:10px;text-align:center}
  .grid3 .c b{display:block;font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--gold);font-weight:600;line-height:1}
  .grid3 .c span{display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--dim);text-transform:uppercase;margin-top:5px}
  .hist{display:flex;gap:4px;flex-wrap:wrap}

  /* =========================================================
     TOURNAMENT-STYLE LOOK (photo heroes, Bebas display, mono labels)
     ========================================================= */
  html{font-synthesis:none}
  :root{ --fd:'Bebas Neue','Arial Narrow',Impact,sans-serif; --fb:'Manrope',-apple-system,'Segoe UI',sans-serif; --fm:'IBM Plex Mono','SFMono-Regular',Menlo,monospace; --clay:#E8895A; --lime:#E6F07A; }
  body{font-family:var(--fb);background:var(--bg)}
  .card,.court,.stat,.att,.t5,.rung,.chartbox,.mbox,.panel,.hm-wrap,.banner,.pending,.plist,.btn,.field,.search{border-radius:3px}
  .stat,.card,.chartbox{border-color:var(--line)}

  /* top bar */
  .topbar{background:rgba(7,17,13,.94);border-bottom:1px solid var(--line)}
  .topbar .wrap{max-width:1180px}
  .brand{font-family:var(--fb);font-weight:800;font-size:13px;letter-spacing:2px;color:var(--text)}
  .brand span{color:var(--text)}
  .brand b{font-family:var(--fm);font-weight:500;color:var(--lime);margin-left:8px;letter-spacing:1px}
  .brand small{display:none}
  .nav{margin:0 auto}
  .nav a{font-family:var(--fm);font-size:10.5px;letter-spacing:1.4px;color:var(--mute);border-radius:0;padding:8px 12px;border:0;border-bottom:2px solid transparent;position:relative}
  .nav a.on{background:transparent;color:var(--lime);border-bottom-color:var(--lime);font-weight:500}
  .nav a .soon{font-size:7.5px;letter-spacing:1px;background:var(--clay);color:#0A1712;padding:1px 4px;border-radius:2px;margin-left:5px;vertical-align:2px}
  .navchip{font-family:var(--fm);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--lime);border:1px solid var(--lime);border-radius:20px;padding:6px 12px;text-decoration:none;white-space:nowrap;background:rgba(230,240,122,.06)}
  .navchip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-right:7px;vertical-align:1px}
  main{padding:0 0 70px}
  main .wrap{max-width:1180px}
  .body-wrap{padding-top:6px}

  /* photo hero */
  .phero{position:relative;background-size:cover;background-position:center;color:var(--text);margin:0 -18px;overflow:hidden}
  .phero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,17,13,.5) 0%,rgba(7,17,13,.62) 45%,rgba(7,17,13,.96) 100%),linear-gradient(90deg,rgba(7,17,13,.72) 0%,rgba(7,17,13,.15) 70%)}
  .phero .pin{position:relative;max-width:1180px;margin:0 auto;padding:64px 22px 30px}
  .phero.sm .pin{padding:44px 22px 24px}
  .phero .kick{font-family:var(--fm);font-size:10.5px;letter-spacing:2.2px;color:#cfd8cf;text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .phero .kick:before{content:"";width:22px;height:1px;background:var(--lime)}
  .phero h1{font-family:var(--fd);font-weight:400;font-size:clamp(54px,11vw,128px);line-height:.9;margin:12px 0 0;text-transform:uppercase;letter-spacing:.5px}
  .phero.sm h1{font-size:clamp(44px,8vw,84px)}
  .phero h1 em{font-style:normal;color:var(--lime);display:block}
  .phero h1 .pt{display:inline-block;width:.14em;height:.14em;background:var(--clay);margin-left:.06em}
  .phero p.sub{font-size:15px;line-height:1.55;max-width:560px;color:#d4ddd4;margin:14px 0 0}
  .phero p.sub b{color:#fff}
  .phero .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));max-width:720px;margin-top:26px;border:1px solid rgba(255,255,255,.14);background:rgba(7,17,13,.55);backdrop-filter:blur(3px)}
  .phero .tile{padding:14px 16px;border-left:1px solid rgba(255,255,255,.14)}
  .phero .tile:first-child{border-left:0}
  .phero .tile span{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#9fb3a8}
  .phero .tile b{display:block;font-family:var(--fd);font-weight:400;font-size:26px;line-height:1.1;margin-top:5px;letter-spacing:.5px}
  .phero .tile i{display:block;font-style:normal;font-family:var(--fm);font-size:10px;color:#9fb3a8;margin-top:3px}
  .phero .pchip{position:absolute;top:22px;right:22px}
  .pc{font-family:var(--fm);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--lime);color:var(--lime);border-radius:20px;padding:6px 13px;background:rgba(7,17,13,.55);text-decoration:none;display:inline-block}
  .pc.clay{border-color:var(--clay);color:var(--clay)}
  .pc.go{border-color:#5FBF8F;color:#5FBF8F}

  /* section headings */
  h2.sec{font-family:var(--fd);font-weight:400;font-size:36px;line-height:1;color:var(--text);letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:44px 0 16px}
  h2.sec:before{content:"";width:22px;height:3px;background:var(--lime);align-self:center;margin-right:-4px}
  h2.sec .hint{font-family:var(--fm);font-size:10.5px;letter-spacing:.2px;color:var(--dim);text-transform:none}
  h2.sec[style*="margin-top:0"]{margin-top:30px!important}

  /* numbers in display type */
  .stat b,.t5 .r,.rung .r,.att .rk,.grid3 .c b,.ph .r,.hero-t,.wh h3,.mbox h3,.throne .t,.lbl-big{font-family:var(--fd);font-weight:400;letter-spacing:.6px}
  .stat b{font-size:34px;color:var(--lime)}
  .t5 .r{font-size:34px}
  .rung .r{font-size:26px}
  .att .rk{font-size:22px}
  .grid3 .c b{font-size:28px}
  .ph .r{font-size:64px}
  .hero{border-radius:3px;border-color:var(--lime)}
  .hero-t{font-size:48px;line-height:.95}
  .hero-k,.throne .k{color:var(--lime)}
  .court-t,.stat span,.lbl,.badge,.chip,.pill,.tag,.medal,.hc,.note,.mono{font-family:var(--fm)}
  .court{border-top-width:3px;background:var(--card)}
  .court-t{letter-spacing:1.4px}
  .chip.go,.pill2.conf{color:#5FBF8F}
  .nextbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding:14px 18px;border:1px solid var(--lime);background:rgba(230,240,122,.07);border-radius:3px;text-decoration:none;color:var(--text)}
  .nextbar b{display:block;font-size:14px}
  .nextbar i{display:block;font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mute);margin-top:3px}
  .nextbar .go2{font-family:var(--fm);font-size:11px;letter-spacing:1px;color:var(--lime);text-transform:uppercase}
  .hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .hl{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
  .hl-i{font-size:22px;line-height:1}
  .hl b{display:block;font-family:var(--fm);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lime);font-weight:500}
  .hl span{display:block;font-size:13.5px;line-height:1.5;color:#d8e0d8;margin-top:4px}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .nchip{font-size:12.5px;font-weight:600;padding:6px 11px;border:1px solid var(--line2);border-radius:2px;background:var(--card2);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .nchip:hover{border-color:var(--lime)}
  .nchip.win{border-color:var(--lime);background:rgba(230,240,122,.1)}
  .nchip .dot{display:inline-block}

  .whytbl{border-collapse:collapse;width:100%;font-size:12px;min-width:640px}
  .whytbl th{font-family:var(--fm);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  .whytbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;color:#d8e0d8}
  /* tournament content */
  .tstage{position:relative;padding-top:26px}
  .tstage .tn{font-family:var(--fd);font-size:54px;line-height:.8;color:var(--lime);opacity:.9;margin-bottom:6px}
  .tstage h3,.rule h3{font-family:var(--fd);font-weight:400;font-size:26px;letter-spacing:.6px;text-transform:uppercase;margin:0 0 6px}
  .rule .tk{font-family:var(--fm);font-size:9.5px;letter-spacing:1.6px;color:var(--clay);margin-bottom:6px}
  .tcap{display:inline-block;margin-top:8px;font-family:var(--fm);font-size:10.5px;color:var(--mute);border:1px dashed var(--line2);padding:5px 9px;border-radius:2px}
  .tcap b{color:var(--lime)}
  .tl{display:flex;height:46px;border-radius:2px;overflow:hidden;font-family:var(--fm);font-size:10.5px;color:#0A1712}
  .tl div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-weight:500}
  .tlax{display:flex;justify-content:space-between;font-family:var(--fm);font-size:9px;color:var(--dim);margin-top:5px}
  .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .team b{display:block;font-family:var(--fd);font-weight:400;font-size:24px;letter-spacing:.6px;margin-top:6px;color:var(--mute)}
  .bm{font-family:var(--fd);font-size:22px;letter-spacing:.6px;color:var(--dim);padding:8px 0;border-top:1px solid var(--line)}
  .band{position:relative;background-size:cover;background-position:center;margin:44px -18px 0;overflow:hidden}
  .band:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,17,13,.88),rgba(7,17,13,.35))}
  .band .pin{position:relative;max-width:1180px;margin:0 auto;padding:70px 22px}
  .band .big{font-family:var(--fd);font-size:clamp(34px,6vw,64px);line-height:.95;text-transform:uppercase;max-width:640px}
  .band .big em{font-style:normal;color:var(--lime)}
  .band p{color:#cfd8cf;max-width:480px;margin-top:10px;font-size:14px}

  @media(max-width:900px){
    .topbar .wrap{flex-wrap:wrap;row-gap:0;padding-bottom:0}
    .nav{order:3;width:100%;margin:0 -13px;padding:0 13px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .nav::-webkit-scrollbar{display:none}
  }
  @media(max-width:680px){
    .phero,.band{margin:0 -13px}
    .phero .pin{padding:44px 16px 22px}
    .phero .tile b{font-size:22px}
    .navchip{font-size:8.5px;padding:5px 9px}
    h2.sec{font-size:30px;margin-top:36px}
    .hero-t{font-size:38px}
  }


  .clist{list-style:none;margin:0;padding:0;max-width:640px}
  .crow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:9px 14px;margin-bottom:6px;cursor:pointer}
  .crow:hover{border-color:var(--lime)}

    const unknown = names.filter(n => !byName[n]);
    const att = names.map(n => byName[n]).filter(Boolean).sort((a,b)=>a.rank-b.rank);
    if(unknown.length) notes.push('Not on the ladder yet (new players, added by Ben): ' + unknown.join(', ') + '.');
    const cs = []; for(let i=0;i<att.length;i+=4) cs.push(att.slice(i,i+4));
    const moved = {};
    const lastR = n => { const l = lastFinishes(n,1)[0]; return l || null; };
    const wf = n => { const f = weightedForm(n); return f ? f.avg : null; };
    const moveWhy = {};
    function swap(ka, a, b, why){
      const ia = cs[ka].indexOf(a), ib = cs[ka+1].indexOf(b);
      cs[ka][ia] = b; cs[ka+1][ib] = a; moved[a.name] = moved[b.name] = true;
      notes.push(why);
      moveWhy[a.name] = 'Moves down to ' + courtLetter(ka+1) + ': ' + why;
      moveWhy[b.name] = 'Moves up to ' + courtLetter(ka) + ': ' + why;
    }
    for(let k=0;k<cs.length-1;k++){
      const above = cs[k].slice(), below = cs[k+1].slice();
      const up = above.filter(p => { const l=lastR(p.name); return l && l.res===4; }).sort((a,b)=>(wf(b.name)||0)-(wf(a.name)||0));
      const dn = below.filter(p => { const l=lastR(p.name); return l && l.res===1; }).sort((a,b)=>(wf(a.name)||99)-(wf(b.name)||99));
      for(let j=0;j<Math.min(up.length,dn.length);j++){
        swap(k, up[j], dn[j], up[j].name + ' (4th last time out) and ' + dn[j].name + ' (won last time out) swap courts at the ' + courtLetter(k) + '/' + courtLetter(k+1) + ' line.');
      }
      const wa = above.filter(p => !moved[p.name] && wf(p.name)!==null).sort((a,b)=>wf(b.name)-wf(a.name))[0];
      const wb = below.filter(p => !moved[p.name] && wf(p.name)!==null).sort((a,b)=>wf(a.name)-wf(b.name))[0];
      if(wa && wb && wf(wa.name) - wf(wb.name) >= FORM_GAP){
        swap(k, wa, wb, 'Form check: ' + wa.name + ' (weighted form ' + wf(wa.name).toFixed(1) + ') moves down and ' + wb.name + ' (' + wf(wb.name).toFixed(1) + ') moves up at the ' + courtLetter(k) + '/' + courtLetter(k+1) + ' line.');
      }
    }
    att.forEach(p => {
      const best = Math.min.apply(null, p.hist.filter(v=>v!==null));
      const lg = log[p.name] || []; const lastPlayed = lg.length ? lg[lg.length-1].n : 0;
      if(best <= 4 && p.rank > 8 && lastWeekNo - lastPlayed >= 2) notes.push('Alumnus check: ' + p.name + ' was once top 4 (best #' + best + ') and is returning. Ben to decide whether the Court A guarantee applies.');
    });
    if(att.length > 0 && att.length < 4) notes.push('At least 4 confirmed players are needed to make a court (' + att.length + ' so far).');
    if(!att.length) notes.push('No confirmed players yet.');
    const courts = cs.map((c,i) => ({name: courtLetter(i), players: c.slice().sort((a,b)=>a.rank-b.rank).map(p => ({name:p.name, rank:p.rank}))}));
    const base = {}; for(let i=0;i<att.length;i++) base[att[i].name] = courtLetter(Math.floor(i/4));
    const why = [];
    courts.forEach(c => c.players.forEach(p => {
      const l2 = lastFinishes(p.name, 2).slice().reverse().map(e => 'W' + e.n + ' ' + ord(e.res) + ' on ' + courtLabel(e.court).replace('Court ','')).join(' \u00b7 ');
      const f = wf(p.name);
      why.push({name:p.name, rank:p.rank, base:base[p.name], court:c.name, last2:l2 || 'no results yet', form:f===null?null:f.toFixed(1), reason: moveWhy[p.name] || (base[p.name]===c.name ? 'Stays on its rank-based court (no swap triggered).' : '')});
    }));
    return {courts:courts, notes:notes, why:why};
  }

  /* what the page shows for the next session: live state, or the saved fallback */
  function weekInfo(){
    const all = live ? live.confirmed.slice() : nextMatch.attendees.slice();
    const spots = all.length >= 4 ? Math.floor(all.length / 4) * 4 : all.length;
    const playing = all.slice(0, spots), waitlist = all.slice(spots);
    const prov = buildCourts(playing);
    let status = 'provisional', courts = prov.courts, notes = prov.notes, banner = '';
    if(waitlist.length) notes = notes.concat(['Waitlist (in order): ' + waitlist.join(', ') + '. They move up automatically if someone cancels.']);
    const snap = live ? live.courts : (nextMatch.courtsPublished ? {status:'confirmed', courts:nextMatch.courts} : null);
    if(snap && snap.status === 'confirmed' && snap.courts && snap.courts.length){
      const a = snap.courts.reduce((x,c)=>x.concat(c.players.map(p=>p.name)),[]).sort().join('|');
      const b = playing.slice().sort().join('|');
      if(a === b){ status = 'confirmed'; courts = snap.courts; notes = []; }
      else banner = 'The confirmed list has changed since Ben approved the courts. The courts below are provisional until he re-approves.';
    }
    return {confirmed:all, playing:playing, waitlist:waitlist, status:status, courts:courts, notes:notes, banner:banner, why:prov.why};
  }
  function deadlineInfo(){
    if(!live || !live.deadline) return {text:'', closed:false};
    const d = new Date(live.deadline); if(isNaN(d)) return {text:'', closed:false};
    const closed = d.getTime() < Date.now();
    const when = d.toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    return {text: (closed ? 'Confirmations closed ' : 'Confirmations close ') + when, closed:closed};
  }

    return '<div class="act"><span>' + esc(a.player) + ' ' + (a.action==='confirm'?'confirmed':'cancelled') + '</span><span>' + new Date(a.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) + '</span></div>';
  }

    return h;
  }

  /* ---------- attendance dialogs ---------- */
  function openDialog(inner){
    const ov = document.createElement('div'); ov.className = 'ov'; ov.style.alignItems = 'center'; ov.style.padding = '16px';
    ov.innerHTML = '<div class="mbox">' + inner + '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if(e.target === ov) ov.remove(); });
    return ov;
  }
  function pickDialog(){
    const roster = (live && live.roster && live.roster.length ? live.roster : players.map(p=>p.name)).slice().sort((a,b)=>a.localeCompare(b));
    const wi = weekInfo();
    const ov = openDialog('<h3>Who are you?</h3><p>Pick your name. You will be asked to confirm before anything changes.</p><input class="field" id="pq" placeholder="Search your name..." autocomplete="off"><div class="plist" id="plist"></div><div class="mbtns"><button class="btn alt" id="pclose">Close</button></div>');
    function draw(q){
      const list = roster.filter(n => n.toLowerCase().indexOf(q) >= 0);
      ov.querySelector('#plist').innerHTML = list.length ? list.map(n => '<div class="pitem" data-n="'+esc(n)+'"><span>'+esc(n)+'</span>'+(wi.confirmed.indexOf(n)>=0?'<span class="tag in">confirmed</span>':'')+'</div>').join('') : '<div class="empty">No match. Ask Ben to add you.</div>';
    }
    draw('');
    ov.querySelector('#pq').addEventListener('input', e => draw(e.target.value.toLowerCase()));
    ov.querySelector('#pclose').addEventListener('click', () => ov.remove());
    ov.querySelector('#plist').addEventListener('click', e => { const it = e.target.closest('.pitem'); if(!it) return; const n = it.getAttribute('data-n'); ov.remove(); confirmDialog(n); });
  }
  function confirmDialog(name){
    const wi = weekInfo(); const isIn = wi.confirmed.indexOf(name) >= 0;
    const weekNo = live ? live.week : null;
    const ov = openDialog(isIn
      ? '<h3>Cancel your spot?</h3><p>You are about to cancel <b>' + esc(name) + '</b> for Week ' + weekNo + '. A missed week moves your status along (Active, Grace, At Risk, Penalty). Please only continue if this is you.</p><div class="mbtns"><button class="btn alt" id="dk">Keep my spot</button><button class="btn warn" id="dgo">Yes, cancel my spot</button></div>'
      : '<h3>Confirm your spot?</h3><p>Confirm <b>' + esc(name) + '</b> as playing in Week ' + weekNo + '. ' + (function(){ const n1 = wi.confirmed.length + 1; return (n1 > 4 && n1 > Math.floor(n1/4)*4) ? 'Courts are full, so you will join the <b>waitlist</b> (position ' + n1 + ') and move up automatically if someone cancels. ' : ''; })() + 'Please only continue if this is you.</p><div class="mbtns"><button class="btn alt" id="dk">Back</button><button class="btn" id="dgo">Yes, I am playing</button></div>');
    ov.querySelector('#dk').addEventListener('click', () => ov.remove());
    ov.querySelector('#dgo').addEventListener('click', async () => {
      const b = ov.querySelector('#dgo'); b.disabled = true; b.textContent = 'Saving...';
      try {
        const r = await apiPost({kind: isIn ? 'cancel' : 'confirm', player: name, week: weekNo});
        if(r.ok){ live = r.state; liveErr = null; setMe(name); toast(isIn ? name + ' cancelled. Thanks for letting us know.' : name + ' confirmed. See you on court!'); }
        else { if(r.state) live = r.state; toast(r.error || 'Something went wrong', true); }
      } catch(e){ toast('Could not reach the server. Please try again.', true); }
      ov.remove(); refreshWeek();
    });
  }
  function currentView(){ const v = ((location.hash || '#/results').replace(/^#\/?/,'').split('/')[0]) || 'results'; return v === 'week' ? 'confirm' : v; }
  function refreshWeek(){ if(currentView() === 'confirm'){ paint(viewConfirm()); bindWeek(); } }
  function bindWeek(){
    const g = id => document.getElementById(id);
    if(g('b-pick')) g('b-pick').addEventListener('click', pickDialog);
    if(g('b-confirm')) g('b-confirm').addEventListener('click', () => confirmDialog(myName()));
    if(g('b-cancel')) g('b-cancel').addEventListener('click', () => confirmDialog(myName()));
    if(g('notme')) g('notme').addEventListener('click', e => { e.preventDefault(); setMe(''); refreshWeek(); });
  }

  function bindAdmin(){
    const g = id => document.getElementById(id);
    const rerender = () => { paint(viewAdmin()); bindAdmin(); };
    const run = async (o, okMsg) => { try { const r = await adminCall(o); toast(r.ok ? okMsg : (r.error || 'Failed'), !r.ok); } catch(e){ toast('Could not reach the server', true); } rerender(); };
    if(g('aunlock')) g('aunlock').addEventListener('click', async () => {
      try { sessionStorage.setItem('ll_key', g('akey').value.trim()); } catch(e){}
      let r; try { r = await adminCall({op:'check'}); } catch(e){ r = {ok:false, error:'Could not reach the server'}; }
      if(!r.ok){ try { sessionStorage.removeItem('ll_key'); } catch(e){} toast(r.error || 'Wrong key', true); return; }
      rerender();
    });
    if(!g('aapprove')) return;
    g('aapprove').addEventListener('click', () => run({op:'approve', courts: weekInfo().courts}, 'Courts approved. They now show as Confirmed Courts.'));
    g('aapprovecustom').addEventListener('click', () => {
      let c; try { c = JSON.parse(g('acustom').value); } catch(e){ toast('That is not valid JSON', true); return; }
      if(c && !Array.isArray(c) && Array.isArray(c.courts)) c = c.courts;
      const ok = Array.isArray(c) && c.length && c.every(x => x && x.name && Array.isArray(x.players) && x.players.every(p => p && p.name));
      if(!ok){ toast('Courts must be a list of {name, players:[{name, rank}]}', true); return; }
      const have = c.reduce((a,x)=>a.concat(x.players.map(p=>p.name)),[]).sort().join('|'), want = weekInfo().playing.slice().sort().join('|');
      if(have !== want){ toast('These courts do not match the current playing list. Check the names.', true); return; }
      run({op:'approve', courts:c}, 'Reviewed courts approved. They now show as Confirmed Courts.');
    });
    g('aunapprove').addEventListener('click', () => run({op:'unapprove'}, 'Courts re-opened as provisional.'));
    g('asetweek').addEventListener('click', () => { if(confirm('Start a new week? This clears the confirmed list.')) run({op:'setWeek', week:g('aweek').value.trim(), date:g('adate').value.trim()}, 'New week started.'); });
    g('asetdl').addEventListener('click', () => { const v = g('adl').value; if(!v){ toast('Pick a date and time', true); return; } run({op:'setDeadline', deadline:new Date(v).toISOString()}, 'Deadline set.'); });
    g('aclrdl').addEventListener('click', () => run({op:'setDeadline', deadline:''}, 'Deadline cleared.'));
    g('aconf').addEventListener('click', () => run({op:'override', player:g('aplayer').value, action:'confirm'}, 'Player confirmed.'));
    g('aremove').addEventListener('click', () => run({op:'override', player:g('aplayer').value, action:'cancel'}, 'Player removed.'));
    g('aadd').addEventListener('click', () => { const n = g('anew').value.trim(); if(!n) return; const r0 = (live&&live.roster||[]).slice(); if(r0.indexOf(n)<0) r0.push(n); run({op:'setRoster', roster:r0}, n + ' added to the roster.'); });
    g('alock').addEventListener('click', () => { try { sessionStorage.removeItem('ll_key'); } catch(e){} rerender(); });
  }

  function resultsStats(wk){
    const i = playedWeeks.indexOf(wk);
    const prev = i > 0 ? playedWeeks[i-1] : null;
    const names = []; wk.courts.forEach(c => c.players.forEach(p => names.push(p.name)));
    const prevNames = []; if(prev) prev.courts.forEach(c => c.players.forEach(p => prevNames.push(p.name)));
    const all = []; wk.courts.forEach((c,ci) => c.players.forEach(p => all.push({name:p.name, pre:p.pre, res:p.res, ci:ci, court:c.name, void:!!c.void})));
    const scored = all.filter(x => !x.void);
    const winners = scored.filter(x => x.res === 1);
    // movers over the whole ladder
    const movers = players.filter(p => p.hist[wk.n-1] != null && wk.n > 1 && p.hist[wk.n-2] != null).map(p => ({name:p.name, d:p.hist[wk.n-2]-p.hist[wk.n-1], from:p.hist[wk.n-2], to:p.hist[wk.n-1], played:names.indexOf(p.name)>=0}));
    const climbers = movers.filter(m => m.played && m.d > 0).sort((a,b)=>b.d-a.d);
    const drops = movers.filter(m => m.d < 0).sort((a,b)=>a.d-b.d);
    // upset: winner who started lowest (highest rank number)
    const upset = winners.slice().sort((a,b)=>b.pre-a.pre)[0];
    // first-ever wins, consecutive wins, debuts, returning
    const firstWin = winners.filter(w => (log[w.name]||[]).filter(e => e.n < wk.n && e.res === 1).length === 0);
    const backToBack = winners.filter(w => { const l = (log[w.name]||[]).filter(e=>e.n<wk.n && !e.void); return l.length && l[l.length-1].res===1 && l[l.length-1].n === (prev?prev.n:-1); });
    const debuts = names.filter(n => (log[n]||[])[0] && log[n][0].n === wk.n);
    const returning = names.filter(n => prevNames.indexOf(n) < 0 && debuts.indexOf(n) < 0);
    const missed = players.filter(p => names.indexOf(p.name) < 0 && p.status !== 'Locked' && firstWeekOf(p) <= wk.n).sort((a,b)=>a.rank-b.rank);
    const statusCount = {}; players.forEach(p => { statusCount[p.status] = (statusCount[p.status]||0)+1; });
    const topNow = players.filter(p => p.hist[wk.n-1] != null).sort((a,b)=>a.hist[wk.n-1]-b.hist[wk.n-1]).slice(0,5);
    // reign of #1
    let reign = 0, holder = topNow[0] ? topNow[0].name : '';
    for(let k = top3ByWeekFull.length-1; k>=0; k--){ if(top3ByWeekFull[k].top3[0] === holder) reign++; else break; }
    return {names:names, prevCount:prevNames.length, prev:prev, winners:winners, climbers:climbers, drops:drops, upset:upset, firstWin:firstWin, backToBack:backToBack, debuts:debuts, returning:returning, missed:missed, statusCount:statusCount, topNow:topNow, holder:holder, reign:reign, movers:movers, all:all};
  }

    h += '<h2 class="sec">Top 5 after Week ' + wk.n + '</h2><div class="top5">' + s.topNow.map((p,k) => { const cur = p.hist[wk.n-1], prv = wk.n>1 ? p.hist[wk.n-2] : null; return '<div class="t5" data-p="'+esc(p.name)+'"><div class="r">#'+cur+'</div><div class="n">'+esc(p.name)+'</div><div>'+mvHtml(prv,cur)+'</div><div style="margin-top:6px">'+badge(p.status)+'</div></div>'; }).join('') + '</div>';

    // attendance
    const nameChip = (n, extraCls) => '<span class="nchip ' + (extraCls||'') + '" data-p="' + esc(n) + '">' + esc(n) + '</span>';
    const winnerNames = s.winners.map(w => w.name);

      s.all.slice().sort((a,b)=>(byName[a.name]?byName[a.name].rank:99)-(byName[b.name]?byName[b.name].rank:99)).map(x => nameChip((winnerNames.indexOf(x.name)>=0?'\u{1F451} ':'') + x.name, winnerNames.indexOf(x.name)>=0?'win':'').replace(/data-p="[^"]*"/, 'data-p="' + esc(x.name) + '"')).join('') + '</div></div>';

      s.missed.map(p => '<span class="nchip" data-p="' + esc(p.name) + '"><i class="dot" style="background:' + statusColors[p.status] + '"></i>' + esc(p.name) + '</span>').join('') + '</div>' +
      '<div class="legend" style="margin-top:12px">' + ['Active','Grace','At Risk','Penalty','Locked'].filter(k => s.statusCount[k]).map(k => '<span class="li"><span class="dot" style="background:' + statusColors[k] + '"></span>' + statusLabel(k) + ' &middot; ' + s.statusCount[k] + '</span>').join('') + '</div></div>';

      return '<div class="court" style="border-top-color:'+col+'"><div class="court-t" style="color:'+col+'"><span>'+courtLabel(c.name)+'</span></div>' +
        c.players.slice().sort((a,b)=>a.res-b.res).map(p => {
          const pl = byName[p.name]; const after = pl ? pl.hist[wk.n-1] : null;
          return '<div class="row"><span>'+(p.res===1?'&#128081; ':'')+nm(p.name)+'</span><span style="display:flex;gap:8px;align-items:center"><span class="rkx">#'+p.pre+(after!=null?' &rarr; #'+after:'')+'</span>'+mvHtml(p.pre, after)+medal(p.res)+'</span></div>';
        }).join('') + '</div>';
    }).join('') + '</div>';
    h += '<h2 class="sec">Ladder after week ' + wk.n + '</h2><details class="card"><summary>Show full ranking (' + players.filter(p=>p.hist[wk.n-1]!=null).length + ' players)</summary>' +
      players.filter(p=>p.hist[wk.n-1]!=null).sort((a,b)=>a.hist[wk.n-1]-b.hist[wk.n-1]).map(p => {
        const cur = p.hist[wk.n-1], prv = wk.n>1 ? p.hist[wk.n-2] : null;

  }


  /* =========================================================
     VIEW: TRENDS (participation + #1)
     ========================================================= */
  const partCounts = playedWeeks.map(w => ({n:w.n, date:w.date, count:w.courts.reduce((a,c)=>a+c.players.length,0)}));
  const playedSet = {}; playedWeeks.forEach(w => { playedSet[w.n] = {}; w.courts.forEach(c => c.players.forEach(p => { playedSet[w.n][p.name] = c.void ? 'v' : 'p'; })); });
  function streakOf(name){ let s = 0; for(let i=playedWeeks.length-1;i>=0;i--){ if(playedSet[playedWeeks[i].n][name]) s++; else break; } return s; }
  function firstWeekOf(p){ const fi = p.hist.findIndex(v=>v!==null)+1; const lg = log[p.name]; return Math.min(fi>0?fi:99, lg&&lg.length?lg[0].n:99); }
  let hmSort = 'rank';

  function courtsOf(x){ return Math.round(x.count/4); }
  function courtsChart(){
    const W = 720, H = 240, L = 40, R = 10, T = 20, B = 28;
    const maxC = Math.max.apply(null, partCounts.map(courtsOf));
    const n = partCounts.length, slot = (W-L-R)/n, bw = Math.min(slot*0.72, 22);
    const unit = (H-T-B)/(maxC+0.4);
    let g = '';
    for(let c=0;c<=maxC;c++){ const y = H-B-c*unit; g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#1d3a2f"/><text x="'+(L-8)+'" y="'+(y+3)+'" fill="#6B8478" font-size="9" font-family="IBM Plex Mono,monospace" text-anchor="end">'+(c*4)+'</text>'; }
    g += '<text x="'+(L-8)+'" y="'+(T-5)+'" fill="#6B8478" font-size="8" font-family="IBM Plex Mono,monospace" text-anchor="end">players</text>';
    let bars = '';
    partCounts.forEach((x,i) => {
      const cx = L + slot*i + slot/2, cs = courtsOf(x);
      for(let c=0;c<cs;c++){
        const y = H-B-(c+1)*unit + 1.5;
        bars += '<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(unit-3)+'" rx="3" fill="'+['#E6F07A','#6FA8FF','#E8895A'][c%3]+'"/>';
      }
      bars += '<g data-gw="'+x.n+'" style="cursor:pointer"><rect x="'+(cx-slot/2)+'" y="'+T+'" width="'+slot+'" height="'+(H-T-B)+'" fill="transparent"/><title>Week '+x.n+': '+cs+' court'+(cs>1?'s':'')+' = '+x.count+' players</title></g>';
      if(i%2===0 || n<12) bars += '<text x="'+cx+'" y="'+(H-10)+'" fill="#6B8478" font-size="8.5" font-family="IBM Plex Mono,monospace" text-anchor="middle">W'+x.n+'</text>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'">'+g+bars+'</svg>' +
      '<div class="legend" style="justify-content:center"><span class="li"><span class="dot" style="background:#E6F07A"></span>Court A</span><span class="li"><span class="dot" style="background:#6FA8FF"></span>Court B</span><span class="li"><span class="dot" style="background:#E8895A"></span>Court C</span><span class="li muted">1 block = 1 court = 4 players</span></div>';
  }
  function heatmapRows(){
    const list = players.filter(p => firstWeekOf(p) < 99);
    const info = list.map(p => { const lg = (log[p.name]||[]); const fw = firstWeekOf(p); const elig = playedWeeks.filter(w=>w.n>=fw).length; return {p:p, played:lg.length, pct: elig?lg.length/elig:0, streak:streakOf(p.name), fw:fw}; });
    if(hmSort==='attendance') info.sort((a,b)=>b.pct-a.pct||a.p.rank-b.p.rank);
    else if(hmSort==='streak') info.sort((a,b)=>b.streak-a.streak||a.p.rank-b.p.rank);
    else info.sort((a,b)=>a.p.rank-b.p.rank);
    const head = '<tr><th class="nm"></th>' + playedWeeks.map(w=>'<th title="Week '+w.n+'">'+w.n+'</th>').join('') + '<th style="min-width:46px">Att.</th><th style="min-width:38px">Strk</th></tr>';
    const body = info.map(x => '<tr><td class="nm" data-p="'+esc(x.p.name)+'">'+esc(x.p.name)+'</td>' + playedWeeks.map(w => {

      return '<td class="c '+(c||'')+'" data-gw="'+w.n+'" title="'+esc(x.p.name)+' &middot; W'+w.n+': '+(c==='p'?'played':c==='v'?'played (void)':'missed')+'"></td>';
    }).join('') + '<td class="s">'+Math.round(x.pct*100)+'%</td><td class="s">'+(x.streak||'&ndash;')+'</td></tr>').join('');
    return '<table class="hm">'+head+body+'</table>';
  }
  function viewTrends(){
    const cc = partCounts.map(courtsOf);
    const wk3 = cc.filter(c=>c>=3).length, wk2 = cc.filter(c=>c===2).length, wk1 = cc.filter(c=>c<=1).length;

    let h = hero({img:2, sm:true, kick:'Oakville Padel Organization \u2014 season', title:'League', accent:'Trends', tiles:[['Weeks played', playedWeeks.length, 'this season'], ['3-court weeks', wk3, '12 players'], ['2-court weeks', wk2, '8 players'], ['Current #1 streak', (function(){ let n=0; for(let q=top3ByWeekFull.length-1;q>=0;q--){ if(top3ByWeekFull[q].top3[0]===top3ByWeekFull[top3ByWeekFull.length-1].top3[0]) n++; else break; } return n; })() + ' wks', top3ByWeekFull[top3ByWeekFull.length-1].top3[0]]]}) + '<h2 class="sec" style="margin-top:0">Participation <span class="hint">courts running each week &middot; tap a bar to open that week</span></h2>';

      '<div class="stat"><b>'+wk2+'</b><span>2-court weeks</span><i>= 8 players</i></div>' +
      '<div class="stat"><b>'+wk1+'</b><span>1-court weeks</span><i>= 4 players</i></div>' +
      '<div class="stat"><b>'+last5.filter(c=>c>=3).length+' of 5</b><span>Last 5 weeks with 3 courts</span><i>Latest: '+courtsOf(lastW)+' courts / '+lastW.count+' players (W'+lastW.n+')</i></div></div>';
    h += '<div class="chartbox" style="margin-top:10px">'+courtsChart()+'</div>';
    h += '<h2 class="sec">Who shows up <span class="hint">green = played &middot; red = void match &middot; dark = missed &middot; tap a cell for that week</span></h2>';
    h += '<div class="tabs"><span class="lab">Sort by</span>' + ['rank','attendance','streak'].map(s => '<button class="pill'+(hmSort===s?' on':'')+'" data-hs="'+s+'">'+s+'</button>').join('') + '<span class="muted mono" style="font-size:10px;margin-left:auto">Longest active streak: '+esc(bestStreak.n)+' ('+bestStreak.s+' wks)</span></div>';
    h += '<div class="hm-wrap" id="hmwrap">'+heatmapRows()+'</div>';

    /* #1 section */
    const tops = top3ByWeekFull.map(w => ({wk:parseInt(w.week.slice(1),10), top3:w.top3}));
    const reigns = [];
    tops.forEach(w => { const last = reigns[reigns.length-1]; if(last && last.name===w.top3[0]) { last.end = w.wk; last.weeks++; } else reigns.push({name:w.top3[0], start:w.wk, end:w.wk, weeks:1}); });
    const tot = {}, longest = {};
    reigns.forEach(r => { tot[r.name] = (tot[r.name]||0)+r.weeks; longest[r.name] = Math.max(longest[r.name]||0, r.weeks); });
    const cur = reigns[reigns.length-1];
    h += '<h2 class="sec" style="margin-top:34px">Who has been #1 <span class="hint">tap a block for details</span></h2>';
    h += '<div class="throne"><div><div class="k">Current #1</div><div class="t">'+esc(cur.name)+'</div><div class="s">On top since Week '+cur.start+' &middot; '+cur.weeks+' week'+(cur.weeks>1?'s':'')+' in a row</div></div>' +
      '<div style="text-align:right"><div class="k">Longest run at #1</div><div class="s" style="color:var(--text);font-size:13px">'+esc(Object.keys(longest).sort((a,b)=>longest[b]-longest[a])[0])+' &middot; '+Math.max.apply(null,Object.values(longest))+' weeks in a row</div></div></div>';
    h += '<div class="chartbox" style="overflow-x:auto"><div class="reigns" id="reigns">' + reigns.map((r,i) => { const col = championColors[r.name]||'#6B8478'; return '<div class="reign'+(i===reigns.length-1?' on':'')+'" data-r="'+i+'" style="flex:'+r.weeks+' 1 0;background:'+col+';color:'+textOn(col)+'"><b>'+(r.weeks>1?esc(r.name):esc(r.name.slice(0,3)))+'</b><i>'+(r.weeks>1?r.weeks+' wks':'1w')+'</i></div>'; }).join('') + '</div>' +
      '<div class="axis">' + reigns.map(r => '<div style="flex:'+r.weeks+' 1 0">'+(r.weeks>1?'W'+r.start+'&ndash;'+r.end:'W'+r.start)+'</div>').join('') + '</div></div>';
    h += '<div class="card" id="reigndetail" style="margin-top:10px"></div>';

    h += '<h2 class="sec">The race to the top <span class="hint">rank by week &middot; tap names to show or hide</span></h2><div class="tabs" id="racetabs"></div><div class="chartbox" id="race"></div>';

    const order = Object.keys(tot).sort((a,b)=>tot[b]-tot[a]||longest[b]-longest[a]);
    const mx = tot[order[0]];
    h += '<h2 class="sec">Throne leaderboard</h2><div class="card"><div class="lb lbh"><span></span><span>Player</span><span>Total weeks at #1</span><span>Longest run</span><span>Times at #1</span></div>' + order.map((n,i) => { const col = championColors[n]||'#6B8478'; return '<div class="lb"><span class="muted mono">'+(i+1)+'</span><span style="font-weight:600">'+esc(n)+'</span><span style="display:flex;align-items:center;gap:8px"><span class="bar2" style="width:'+(tot[n]/mx*100)+'%;background:'+col+'"></span><b class="mono" style="color:var(--gold);font-size:12px">'+tot[n]+'</b></span><span class="mono">'+longest[n]+' in a row</span><span class="mono">'+reigns.filter(r=>r.name===n).length+'x</span></div>'; }).join('') + '<div class="note" style="margin-top:12px">Total weeks counts every week a player held #1. A run is an unbroken stretch at #1, and Times at #1 is how many separate runs they have had. For example, '+esc(order[0])+' has held #1 for '+tot[order[0]]+' weeks in total, over '+reigns.filter(r=>r.name===order[0]).length+' separate runs, the longest lasting '+longest[order[0]]+' weeks in a row.</div></div>';
    window.__reigns = reigns;
    return h;
  }
  let raceOn = null;
  function drawRace(){
    const contenders = Object.keys(championColors);
    if(!raceOn){ raceOn = {}; contenders.forEach(n => raceOn[n] = true); }
    const palette = Object.assign({"Paul":"#6FA8FF","Joey":"#E86AA6","Hussam":"#9AD14B","George":"#F28B52"}, championColors);
    const names = contenders.concat(["Paul","Joey","Hussam","George"]).filter((v,i,a)=>a.indexOf(v)===i && byName[v]);
    document.getElementById('racetabs').innerHTML = names.map(n => '<button class="tog'+(raceOn[n]?' on':'')+'" data-rn="'+esc(n)+'"><span class="dot" style="background:'+palette[n]+'"></span>'+esc(n)+'</button>').join('');
    const W=720,H=250,L=30,R=14,T=14,B=24, MAXR=8, nW=weekLabels.length;
    const sx = i => L + i*(W-L-R)/(nW-1), sy = r => T + (r-1)/(MAXR-1)*(H-T-B);
    let g=''; for(let r=1;r<=MAXR;r++) g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(r)+'" y2="'+sy(r)+'" stroke="#1d3a2f"/><text x="'+(L-6)+'" y="'+(sy(r)+3)+'" fill="#6B8478" font-size="9" font-family="IBM Plex Mono,monospace" text-anchor="end">#'+r+'</text>';
    let xl=''; weekLabels.forEach((l,i)=>{ if(i%2===0) xl += '<text x="'+sx(i)+'" y="'+(H-6)+'" fill="#6B8478" font-size="8.5" font-family="IBM Plex Mono,monospace" text-anchor="middle">'+l+'</text>'; });
    let lines='';
    names.filter(n=>raceOn[n]).forEach(n => {
      const hst = byName[n].hist; let seg=[]; const segs=[];
      hst.forEach((v,i) => { if(v!==null && v<=MAXR) seg.push([sx(i),sy(v)]); else { if(seg.length) segs.push(seg); seg=[]; } }); if(seg.length) segs.push(seg);
      segs.forEach(s => { lines += '<polyline points="'+s.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+palette[n]+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>' + s.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="'+palette[n]+'"/>').join(''); });

    document.getElementById('race').innerHTML = '<svg viewBox="0 0 '+W+' '+H+'">'+g+lines+xl+'</svg>';
  }
  function showReign(i){
    const r = window.__reigns[i]; const col = championColors[r.name]||'#6B8478';

    const rows = top3ByWeekFull.filter(w => { const n=parseInt(w.week.slice(1),10); return n>=r.start && n<=r.end; }).map(w => {
      const n = parseInt(w.week.slice(1),10); const wk = weeks.find(x=>x.n===n);
      return '<div class="rk-row" style="grid-template-columns:50px 1fr"><b class="mono" style="color:var(--gold)">W'+n+'</b><span style="font-size:12.5px"><a href="#/weeks/'+n+'" style="color:var(--green);text-decoration:none">'+(wk&&wk.date?fmtDate(wk.date):'view')+'</a> &nbsp; &#128081; '+esc(w.top3[0])+' &middot; '+esc(w.top3[1])+' &middot; '+esc(w.top3[2])+'</span></div>';
    }).join('');
    document.getElementById('reigndetail').innerHTML = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="dot" style="background:'+col+';width:12px;height:12px"></span><b style="font-size:16px">'+esc(r.name)+' &middot; #1 run</b><span class="muted mono" style="font-size:11px">'+r.weeks+' week'+(r.weeks>1?'s':'')+' &middot; Week '+r.start+(r.end>r.start?' to '+r.end:'')+'</span></div><div class="note" style="margin:0 0 4px">Top 3 each week of this run</div>'+rows;
  }
  function bindTrends(){
    document.getElementById('reigns').addEventListener('click', e => { const b = e.target.closest('.reign'); if(b) showReign(+b.getAttribute('data-r')); });
    showReign(window.__reigns.length-1);

    document.querySelectorAll('[data-hs]').forEach(b => b.addEventListener('click', () => { hmSort = b.getAttribute('data-hs'); document.querySelectorAll('[data-hs]').forEach(x=>x.classList.toggle('on', x===b)); document.getElementById('hmwrap').innerHTML = heatmapRows(); }));
  }

    '<div class="card rule"><h3>The ladder</h3><p>Every player has a rank. Each week, confirmed players are split into courts of four by rank: the top four go to Court A, the next four to Court B, and so on.</p></div>' +

    '<div class="card rule"><h3>Promotion and relegation</h3><p>Winning a lower court makes you a promotion candidate; finishing last on a higher court makes you a relegation candidate. At each court boundary the pair swap seats, and only recent form decides ties.</p></div>' +
    '<div class="card rule"><h3>Form check</h3><p>Each player&rsquo;s last two played sessions are scored with a court-level weight (each court level adds 3 points, so winning a lower court counts like finishing 4th on the court above). A player whose form is clearly weaker than the player below the cut-line can be moved down, and the stronger player moves up.</p></div>' +
    '<div class="card rule"><h3>Attendance and statuses</h3><p>Playing resets you to Active. Missing weeks moves you down the status ladder:</p><table class="st"><tr><th>Status</th><th>When</th><th>Effect</th></tr>' +
      '<tr><td>'+badge('Active')+'</td><td>Played</td><td>None</td></tr><tr><td>'+badge('Grace')+'</td><td>Missed 1</td><td>Rank held</td></tr><tr><td>'+badge('At Risk')+'</td><td>Missed 2</td><td>Rank held</td></tr><tr><td>'+badge('Penalty')+'</td><td>Missed 3+</td><td>Drops 2 places per week</td></tr><tr><td>'+badge('Locked')+'</td><td>Long absence</td><td>Held at the bottom</td></tr></table></div>' +
    '<div class="card rule"><h3>New and returning players</h3><p>New players join at the bottom of the active ladder the week they are added and enter the normal pipeline the following week. Former top-four players get a one-time guaranteed Court A seat when they return.</p></div>' +

  /* =========================================================
     PLAYER PANEL
     ========================================================= */
  function openPlayer(name){
    const p = byName[name]; if(!p) return;
    const lg = (log[name] || []);
    const played = lg.length, wins = lg.filter(e=>e.res===1).length;
    const pod = lg.filter(e=>e.res && e.res<=3).length;
    const scored = lg.filter(e=>!e.void);
    const avg = scored.length ? (scored.reduce((a,e)=>a+e.res,0)/scored.length).toFixed(2) : '&mdash;';
    const fi = p.hist.findIndex(v=>v!==null)+1; const first = Math.min(fi>0?fi:99, lg.length?lg[0].n:99);
    const elig = playedWeeks.filter(w=>w.n>=first).length;
    const d = p.prev - p.rank;
    const trend = d>0 ? 'Climbed '+d+' spot'+(d>1?'s':'')+' last week' : d<0 ? 'Dropped '+Math.abs(d)+' spot'+(Math.abs(d)>1?'s':'')+' last week' : 'No change last week';
    const wf = weightedForm(name);
    const wi3 = weekInfo(); const nxt = wi3.courts.map((c,ci)=>({c:c,ci:ci})).find(x => x.c.players.some(q=>q.name===name)) || null;
    const conf = wi3.confirmed.indexOf(name) >= 0;
    const el = document.createElement('div'); el.className = 'ov';
    el.innerHTML = '<div class="panel"><div class="ph"><div><div class="r">#'+p.rank+'</div><div class="n">'+esc(p.name)+'</div>'+badge(p.status)+'</div><button class="x" aria-label="Close">&#10005;</button></div>' +
      '<div class="note" style="margin-top:10px">'+trend+'</div>' +
      (conf ? '<div class="lbl">Next session</div><div class="card" style="padding:10px 14px;font-size:13px">Confirmed for Week '+(live?live.week:parseInt(nextMatch.week.replace(/\D/g,''),10))+(nxt ? ' &middot; <b>'+courtLabel(nxt.c.name)+'</b>' + (wi3.status==='confirmed'?'':' (provisional)') : ' &middot; court to be announced')+'</div>' : '') +
      '<div class="lbl">Rank history &mdash; full season</div>' + sparkline(p.hist, weekLabels, 320, 100, {labels:true}) +
      '<div class="lbl">Season stats</div><div class="grid3"><div class="c"><b>'+wins+'</b><span>Court wins</span></div><div class="c"><b>'+pod+'</b><span>Podiums</span></div><div class="c"><b>'+avg+'</b><span>Avg finish</span></div>' +
        '<div class="c"><b>'+played+'</b><span>Weeks played</span></div><div class="c"><b>'+(elig?Math.round(played/elig*100)+'%':'&mdash;')+'</b><span>Attendance</span></div><div class="c"><b>'+(wf?wf.avg.toFixed(1):'&mdash;')+'</b><span>Form (last '+(wf?wf.n:2)+')</span></div></div>' +
      '<div class="note">Form is the average court-weighted finish over the last two played sessions (lower is better; each court level adds 3).</div>' +
      '<div class="lbl">Court finishes by week</div>' + (lg.length ? '<div class="hist">' + lg.slice().reverse().map(e => {
        const col = COURT_COLORS[e.ci%COURT_COLORS.length];
        const res = e.void ? 'void' : ord(e.res);
        const bg = e.void ? 'rgba(224,96,63,.15)' : e.res===1 ? 'rgba(230,240,122,.22)' : 'var(--card2)';
        return '<div class="hc" data-w="'+e.n+'" style="background:'+bg+';border-color:'+col+'">W'+e.n+'<br><b>'+res+'</b><small>'+courtLabel(e.court).replace('Court ','Ct ')+'</small></div>';
      }).join('') + '</div>' : '<div class="note">No matches played yet.</div>') +
      '</div>';
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    function close(){ el.remove(); document.body.style.overflow = ''; }
    el.querySelector('.x').addEventListener('click', close);
    el.addEventListener('click', e => { if(e.target===el) close(); const hc = e.target.closest('.hc'); if(hc){ close(); location.hash = '#/weeks/'+hc.getAttribute('data-w'); } });
  }

  /* =========================================================
     ROUTER
     ========================================================= */
  const app = document.getElementById('app');
  function route(){
    const parts = (location.hash || '#/results').replace(/^#\/?/,'').split('/');
    let v = parts[0] || 'results'; if(v === 'week') v = 'confirm';
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('data-v') === v));
    let html, after;
    if(v === 'standings'){ html = viewStandings(); after = bindStandings; }
    else if(v === 'weeks'){ const sel = parseInt(parts[1],10) || playedWeeks[playedWeeks.length-1].n; html = viewWeeks(sel); after = function(){ bindWeeks(sel); }; }
    else if(v === 'trends'){ html = viewTrends(); after = bindTrends; }
    else if(v === 'rules'){ html = viewRules(); }
    else if(v === 'tournament'){ html = viewTournament(); }
    else if(v === 'admin'){ html = viewAdmin(); after = function(){ bindAdmin(); if(adminKey()) loadState().then(function(){ if(currentView()==='admin'){ paint(viewAdmin()); bindAdmin(); } }); }; }
    else if(v === 'confirm'){ html = viewConfirm(); after = function(){ bindWeek(); if(Date.now() - lastLoad > 4000) loadState().then(refreshWeek); }; }
    else { html = viewResults(); after = function(){ if(Date.now() - lastLoad > 4000) loadState().then(function(){ if(currentView() === 'results'){ paint(viewResults()); updateChrome(); } }); }; }
    paint(html);
    updateChrome();
    if(after) after();
    window.scrollTo(0, 0);
  }
  function updateChrome(){
    const wi = weekInfo(); const wkNo = live ? live.week : parseInt(nextMatch.week.replace(/\D/g,''),10);
    const chip = document.getElementById('navchip'); if(chip) chip.innerHTML = '<i></i>Week ' + wkNo + ' \u00b7 ' + wi.confirmed.length + ' confirmed';
    const b = document.getElementById('brandwk'); if(b) b.textContent = '/ WK ' + lastWeekNo;
  }
  function bindWeeks(sel){
    const wk = weeks.find(w=>w.n===sel) || playedWeeks[playedWeeks.length-1];
    const idx = weeks.indexOf(wk);
    document.getElementById('wsel').addEventListener('change', e => { location.hash = '#/weeks/'+e.target.value; });
    document.getElementById('wprev').addEventListener('click', () => { if(idx>0) location.hash = '#/weeks/'+weeks[idx-1].n; });
    document.getElementById('wnext').addEventListener('click', () => { if(idx<weeks.length-1) location.hash = '#/weeks/'+weeks[idx+1].n; });
    document.getElementById('strip').addEventListener('click', e => { const c = e.target.closest('.wc[data-w]'); if(c) location.hash = '#/weeks/'+c.getAttribute('data-w'); });
    const on = document.querySelector('#strip .wc.on'); if(on) on.scrollIntoView({inline:'center', block:'nearest'});
  }
  document.addEventListener('click', e => {
    const gw = e.target.closest('[data-gw]'); if(gw){ location.hash = '#/weeks/'+gw.getAttribute('data-gw'); return; }
    const t = e.target.closest('[data-p]');
    if(t && !t.closest('.ov')) openPlayer(t.getAttribute('data-p'));
  });
  loadPhotos();
  window.addEventListener('hashchange', route);
  setInterval(function(){ if(currentView()==='confirm' && !document.querySelector('.ov') && !document.hidden){ loadState().then(refreshWeek); } }, 20000);
  loadState().then(function(){ if(currentView()==='confirm') refreshWeek(); if(currentView()==='admin' && adminKey()){ paint(viewAdmin()); bindAdmin(); } updateChrome(); });
  document.getElementById('foot').textContent = 'Legends League · Oakville Padel Organization · Standings through Week ' + lastWeekNo;
  route();
})();
</script>
</body>
</html>
